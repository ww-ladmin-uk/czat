<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LLM Chat App – Dark Material You</title>

        <style>
            :root {
                /* Material You Dark Palette */
                --md-primary: #bb86fc;
                --md-primary-hover: #cf9bff;

                --md-surface: #121212;
                --md-surface-variant: #1e1e1e;
                --md-surface-light: #2a2a2a;

                --md-outline: #3a3a3a;

                --md-text: #e6e6e6;
                --md-text-light: #b3b3b3;

                --md-user-msg: #2e1b47;
                --md-assistant-msg: #1f1f1f;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Oxygen, Ubuntu, Cantarell, sans-serif;
                line-height: 1.6;
                color: var(--md-text);
                background-color: var(--md-surface);
                max-width: 800px;
                margin: 0 auto;
                padding: 1rem;
            }

            header {
                text-align: center;
                margin-bottom: 2rem;
                padding: 1rem 0;
                border-bottom: 1px solid var(--md-outline);
            }

            h1 {
                font-size: 1.5rem;
                color: var(--md-primary);
            }

            .chat-container {
                display: flex;
                flex-direction: column;
                height: calc(100vh - 200px);
                min-height: 400px;
                border: 1px solid var(--md-outline);
                border-radius: 12px;
                overflow: hidden;
                background-color: var(--md-surface-variant);
            }

            .chat-messages {
                flex: 1;
                overflow-y: auto;
                padding: 1rem;
                background-color: var(--md-surface);
            }

            .message {
                margin-bottom: 1rem;
                padding: 0.75rem;
                border-radius: 12px;
                max-width: 80%;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            }

            .message p {
                white-space: pre-line;
                margin: 0;
                overflow-wrap: anywhere;
            }
